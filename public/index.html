<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotManager Pro | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: transform 0.2s; }
        .btn-primary:hover { transform: scale(1.02); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">BotManager <span class="text-indigo-400">Pro</span></h1>
                <p class="text-gray-400">Multi-Bot Hosting Panel</p>
            </div>
            <button onclick="document.getElementById('addBotModal').classList.toggle('hidden')" class="btn-primary px-6 py-2 rounded-lg font-semibold">
                <i class="fas fa-plus mr-2"></i> Add New Bot
            </button>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8" id="statsGrid">
            <div class="glass p-6 rounded-2xl">
                <p class="text-gray-400 text-sm">Total Bots</p>
                <h2 class="text-2xl font-bold" id="stat-total-bots">0</h2>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-gray-400 text-sm">Total Users</p>
                <h2 class="text-2xl font-bold" id="stat-total-users">0</h2>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-gray-400 text-sm">Live Bots</p>
                <h2 class="text-green-400 text-2xl font-bold" id="stat-active-bots">0</h2>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-gray-400 text-sm">Growth (24h)</p>
                <h2 class="text-indigo-400 text-2xl font-bold" id="stat-new-users">0</h2>
            </div>
        </div>

        <!-- Bots List -->
        <div id="botsList" class="grid grid-cols-1 gap-6">
            <!-- Bot cards will be injected here -->
        </div>
    </div>

    <!-- Add Bot Modal -->
    <div id="addBotModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-4">Add Telegram Bot</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Bot Token</label>
                    <input id="tokenInput" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500" placeholder="123456:ABC-DEF...">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Admin Chat ID</label>
                    <input id="adminIdInput" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500" placeholder="512345678">
                </div>
                <button onclick="addBot()" id="saveBotBtn" class="w-full btn-primary py-3 rounded-lg font-bold">Verify & Connect</button>
                <button onclick="document.getElementById('addBotModal').classList.add('hidden')" class="w-full text-gray-400 text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        async function fetchBots() {
            const res = await fetch('/api/bots');
            const bots = await res.json();
            
            // Update Stats
            document.getElementById('stat-total-bots').innerText = bots.length;
            document.getElementById('stat-active-bots').innerText = bots.filter(b => b.status === 'active').length;
            document.getElementById('stat-total-users').innerText = bots.reduce((a, b) => a + b.total_users, 0);
            document.getElementById('stat-new-users').innerText = bots.reduce((a, b) => a + b.new_users, 0);

            // Update List
            const list = document.getElementById('botsList');
            list.innerHTML = bots.map(bot => `
                <div class="glass p-6 rounded-2xl">
                    <div class="flex flex-wrap justify-between items-start">
                        <div>
                            <h3 class="text-xl font-bold text-indigo-400">@${bot.username}</h3>
                            <p class="text-sm text-gray-500">ID: ${bot.admin_id}</p>
                        </div>
                        <div class="flex space-x-2">
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${bot.status === 'active' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                                ${bot.status.toUpperCase()}
                            </span>
                        </div>
                    </div>
                    
                    <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <h4 class="font-semibold mb-3 text-gray-300">Configuration</h4>
                            <div class="space-y-3">
                                <input type="text" value="${bot.welcome_msg}" id="msg-${bot.token}" class="w-full bg-slate-800 rounded p-2 text-sm border border-slate-700">
                                <input type="text" placeholder="Force Join Channels (@ch1, @ch2)" value="${bot.force_channels}" id="ch-${bot.token}" class="w-full bg-slate-800 rounded p-2 text-sm border border-slate-700">
                                <div class="flex space-x-2">
                                    <button onclick="updateBot('${bot.token}')" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded text-sm">Save Settings</button>
                                    <button onclick="broadcast('${bot.token}')" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-sm">Broadcast</button>
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col justify-end items-end space-y-2">
                             <button onclick="botAction('${bot.token}', 'delete')" class="text-red-400 hover:text-red-300 text-sm"><i class="fas fa-trash mr-1"></i> Delete Bot</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function addBot() {
            const token = document.getElementById('tokenInput').value;
            const admin_id = document.getElementById('adminIdInput').value;
            const btn = document.getElementById('saveBotBtn');
            
            btn.innerText = "Verifying...";
            const res = await fetch('/api/bots/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, admin_id })
            });
            const data = await res.json();
            
            if (data.success) {
                location.reload();
            } else {
                alert(data.error || "Failed to add bot");
                btn.innerText = "Verify & Connect";
            }
        }

        async function updateBot(token) {
            const welcome_msg = document.getElementById(`msg-${token}`).value;
            const force_channels = document.getElementById(`ch-${token}`).value;
            await fetch('/api/bots/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, welcome_msg, force_channels, welcome_type: 'text' })
            });
            alert("Settings updated!");
        }

        async function botAction(token, action) {
            if (!confirm(`Are you sure you want to ${action}?`)) return;
            await fetch('/api/bots/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, action })
            });
            fetchBots();
        }

        async function broadcast(token) {
            const msg = prompt("Enter message to broadcast to all users:");
            if (!msg) return;
            const res = await fetch('/api/bots/broadcast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, message: msg, type: 'text' })
            });
            const data = await res.json();
            alert(`Broadcast sent to ${data.count} users!`);
        }

        fetchBots();
        setInterval(fetchBots, 30000); // Auto refresh every 30s
    </script>
</body>
</html>
