<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotManager Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .page-section { display: none; }
        .page-section.active { display: block; }
        .sidebar-item.active { background: #1e293b; border-left: 4px solid #6366f1; color: #818cf8; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
        <div class="p-6 text-2xl font-bold text-indigo-500 flex items-center">
            <i class="fas fa-robot mr-2"></i> BotPro
        </div>
        <nav class="flex-1">
            <button onclick="showPage('overview')" id="nav-overview" class="sidebar-item active w-full text-left px-6 py-4 transition-all">
                <i class="fas fa-th-large mr-2"></i> Overview
            </button>
            <button onclick="showPage('bots')" id="nav-bots" class="sidebar-item w-full text-left px-6 py-4 transition-all">
                <i class="fas fa-server mr-2"></i> My Bots
            </button>
            <button onclick="showPage('users')" id="nav-users" class="sidebar-item w-full text-left px-6 py-4 transition-all">
                <i class="fas fa-users mr-2"></i> User List
            </button>
        </nav>
    </aside>

    <!-- Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 border-b border-slate-800 flex items-center justify-between px-8 bg-slate-900/50">
            <h2 id="page-title" class="text-lg font-semibold">Overview</h2>
            <button onclick="toggleModal('addBotModal', true)" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg text-sm font-bold transition-all">
                <i class="fas fa-plus mr-2"></i> Add Bot
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <!-- SECTION: OVERVIEW -->
            <section id="overview" class="page-section active">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="glass p-6 rounded-2xl">
                        <p class="text-slate-400 text-xs font-bold uppercase">Total Bots</p>
                        <h3 id="stat-bots" class="text-3xl font-bold mt-2">0</h3>
                    </div>
                    <div class="glass p-6 rounded-2xl">
                        <p class="text-slate-400 text-xs font-bold uppercase">Total Users</p>
                        <h3 id="stat-users" class="text-3xl font-bold mt-2 text-indigo-400">0</h3>
                    </div>
                </div>
            </section>

            <!-- SECTION: BOTS -->
            <section id="bots" class="page-section">
                <div id="bots-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </section>

            <!-- SECTION: USERS -->
            <section id="users" class="page-section">
                <div class="glass rounded-2xl overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-800 text-slate-400 text-xs">
                            <tr>
                                <th class="p-4">User</th>
                                <th class="p-4">Bot</th>
                                <th class="p-4">Points</th>
                                <th class="p-4">Joined At</th>
                            </tr>
                        </thead>
                        <tbody id="user-table" class="text-sm"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal: Add Bot -->
    <div id="addBotModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="glass p-8 rounded-2xl w-full max-w-md">
            <h3 class="text-xl font-bold mb-6">Add New Bot</h3>
            <div class="space-y-4">
                <input id="new-token" type="text" placeholder="Bot Token (from @BotFather)" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl focus:border-indigo-500 outline-none">
                <input id="new-admin" type="text" placeholder="Admin Chat ID" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl focus:border-indigo-500 outline-none">
                <button onclick="saveBot()" class="w-full bg-indigo-600 py-3 rounded-xl font-bold shadow-lg shadow-indigo-500/20">Verify & Connect</button>
                <button onclick="toggleModal('addBotModal', false)" class="w-full text-slate-500 text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal: Edit Bot -->
    <div id="editBotModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="glass p-8 rounded-2xl w-full max-w-2xl my-auto">
            <h3 class="text-xl font-bold mb-6 text-indigo-400">Settings: <span id="edit-header"></span></h3>
            <input type="hidden" id="edit-token">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <label class="block text-xs font-bold text-slate-500">Welcome Message</label>
                    <textarea id="edit-msg" rows="4" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none"></textarea>
                    
                    <label class="block text-xs font-bold text-slate-500">Media Type</label>
                    <select id="edit-type" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                        <option value="text">Text Only</option>
                        <option value="photo">Photo</option>
                        <option value="video">Video</option>
                        <option value="animation">GIF/Animation</option>
                    </select>
                </div>
                <div class="space-y-4">
                    <label class="block text-xs font-bold text-slate-500">Media URL or FileID</label>
                    <input id="edit-media" type="text" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                    
                    <label class="block text-xs font-bold text-slate-500">Force Join Channels (@channel1, @channel2)</label>
                    <input id="edit-channels" type="text" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm">
                </div>
            </div>
            <div class="mt-8 flex space-x-3">
                <button onclick="updateBot()" class="flex-1 bg-indigo-600 py-3 rounded-xl font-bold">Save Changes</button>
                <button onclick="toggleModal('editBotModal', false)" class="px-6 py-3 border border-slate-700 rounded-xl">Close</button>
            </div>
        </div>
    </div>

    <script>
        function showPage(id) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav-' + id).classList.add('active');
            document.getElementById('page-title').innerText = id.charAt(0).toUpperCase() + id.slice(1);
            
            if(id === 'overview') fetchStats();
            if(id === 'bots') fetchBots();
            if(id === 'users') fetchUsers();
        }

        function toggleModal(id, show) {
            document.getElementById(id).classList.toggle('hidden', !show);
        }

        async function fetchStats() {
            const res = await fetch('/api/stats');
            const data = await res.json();
            document.getElementById('stat-bots').innerText = data.total_bots;
            document.getElementById('stat-users').innerText = data.total_users;
        }

        async function fetchBots() {
            const res = await fetch('/api/bots');
            const bots = await res.json();
            const list = document.getElementById('bots-list');
            list.innerHTML = bots.map(bot => `
                <div class="glass p-6 rounded-2xl">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-indigo-400 font-bold text-lg">@${bot.username}</h3>
                        <span class="text-[10px] bg-indigo-500/20 px-2 py-1 rounded text-indigo-300 font-bold">ACTIVE</span>
                    </div>
                    <p class="text-sm text-slate-400 mb-6">Users: ${bot.total_users}</p>
                    <div class="flex space-x-2">
                        <button onclick='openEditor(${JSON.stringify(bot)})' class="flex-1 bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-xs font-bold transition-all"><i class="fas fa-cog mr-1"></i> Config</button>
                        <button onclick="deleteBot('${bot.token}')" class="px-4 bg-red-500/10 text-red-500 py-2 rounded-lg text-xs"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        async function fetchUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            document.getElementById('user-table').innerHTML = users.map(u => `
                <tr class="border-t border-slate-800 hover:bg-slate-800/30">
                    <td class="p-4">@${u.username} <br> <small class="text-slate-500">${u.user_id}</small></td>
                    <td class="p-4 text-indigo-400">Bot Instance</td>
                    <td class="p-4 font-bold text-green-400">${u.points}</td>
                    <td class="p-4 text-slate-500">${new Date(u.joined_at).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        async function saveBot() {
            const token = document.getElementById('new-token').value;
            const admin_id = document.getElementById('new-admin').value;
            const res = await fetch('/api/bots/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ token, admin_id })
            });
            if(res.ok) { toggleModal('addBotModal', false); fetchBots(); }
            else { alert("Token Invalid or already exists"); }
        }

        function openEditor(bot) {
            document.getElementById('edit-token').value = bot.token;
            document.getElementById('edit-msg').value = bot.welcome_msg;
            document.getElementById('edit-type').value = bot.welcome_type;
            document.getElementById('edit-media').value = bot.welcome_media || '';
            document.getElementById('edit-channels').value = bot.force_channels || '';
            document.getElementById('edit-header').innerText = '@' + bot.username;
            toggleModal('editBotModal', true);
        }

        async function updateBot() {
            const payload = {
                token: document.getElementById('edit-token').value,
                welcome_msg: document.getElementById('edit-msg').value,
                welcome_type: document.getElementById('edit-type').value,
                welcome_media: document.getElementById('edit-media').value,
                force_channels: document.getElementById('edit-channels').value
            };
            const res = await fetch('/api/bots/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(res.ok) { alert("Settings Updated!"); toggleModal('editBotModal', false); fetchBots(); }
        }

        async function deleteBot(token) {
            if(!confirm("Delete this bot?")) return;
            await fetch('/api/bots/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ token, action: 'delete' })
            });
            fetchBots();
        }

        // Init
        fetchStats();
    </script>
</body>
</html>
